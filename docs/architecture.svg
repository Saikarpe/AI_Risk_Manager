<svg width="1200" height="480" viewBox="0 0 1200 480" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1200" height="480" fill="#0f1220"/>
  <text x="600" y="45" text-anchor="middle" fill="#f5f6fa" font-size="26" font-weight="700">Pre-Shipment Return-Risk Scorer — Architecture</text>
  <text x="600" y="72" text-anchor="middle" fill="#9aa1b5" font-size="14">Razorpay AI Buildathon 2026 · Track 02: AI Risk Manager</text>

  <!-- Box 1: Data -->
  <g>
    <rect x="40" y="140" width="230" height="180" rx="14" fill="#1b2036" stroke="#3d4a78" stroke-width="2"/>
    <text x="155" y="175" text-anchor="middle" fill="#8ecbff" font-size="18" font-weight="700">1. Data</text>
    <text x="155" y="205" text-anchor="middle" fill="#e6e8f0" font-size="13">generate_data.py</text>
    <text x="155" y="228" text-anchor="middle" fill="#c3c8db" font-size="12">Synthetic orders</text>
    <text x="155" y="248" text-anchor="middle" fill="#c3c8db" font-size="12">~9% base return rate</text>
    <text x="155" y="268" text-anchor="middle" fill="#c3c8db" font-size="12">train.csv / test.csv</text>
    <text x="155" y="292" text-anchor="middle" fill="#7f8bb0" font-size="11">(schema.json = single</text>
    <text x="155" y="308" text-anchor="middle" fill="#7f8bb0" font-size="11">source of truth)</text>
  </g>

  <!-- Box 2: Model -->
  <g>
    <rect x="320" y="140" width="230" height="180" rx="14" fill="#1b2036" stroke="#3d4a78" stroke-width="2"/>
    <text x="435" y="175" text-anchor="middle" fill="#8ecbff" font-size="18" font-weight="700">2. Model</text>
    <text x="435" y="205" text-anchor="middle" fill="#e6e8f0" font-size="13">train.py (XGBoost)</text>
    <text x="435" y="228" text-anchor="middle" fill="#c3c8db" font-size="12">class-weighted training</text>
    <text x="435" y="248" text-anchor="middle" fill="#c3c8db" font-size="12">cost-curve threshold</text>
    <text x="435" y="268" text-anchor="middle" fill="#c3c8db" font-size="12">selection (recall floor)</text>
    <text x="435" y="292" text-anchor="middle" fill="#7f8bb0" font-size="11">model.pkl</text>
    <text x="435" y="308" text-anchor="middle" fill="#7f8bb0" font-size="11">metrics.json</text>
  </g>

  <!-- Box 3: API -->
  <g>
    <rect x="600" y="140" width="230" height="180" rx="14" fill="#1b2036" stroke="#3d4a78" stroke-width="2"/>
    <text x="715" y="175" text-anchor="middle" fill="#8ecbff" font-size="18" font-weight="700">3. API</text>
    <text x="715" y="205" text-anchor="middle" fill="#e6e8f0" font-size="13">FastAPI (Render/Railway)</text>
    <text x="715" y="230" text-anchor="middle" fill="#c3c8db" font-size="12">POST /score</text>
    <text x="715" y="250" text-anchor="middle" fill="#c3c8db" font-size="12">POST /score/batch</text>
    <text x="715" y="270" text-anchor="middle" fill="#c3c8db" font-size="12">GET /metrics</text>
    <text x="715" y="292" text-anchor="middle" fill="#7f8bb0" font-size="11">CORS enabled for</text>
    <text x="715" y="308" text-anchor="middle" fill="#7f8bb0" font-size="11">Lovable frontend domain</text>
  </g>

  <!-- Box 4: UI -->
  <g>
    <rect x="880" y="140" width="230" height="180" rx="14" fill="#1b2036" stroke="#3d4a78" stroke-width="2"/>
    <text x="995" y="175" text-anchor="middle" fill="#8ecbff" font-size="18" font-weight="700">4. Lovable UI</text>
    <text x="995" y="205" text-anchor="middle" fill="#e6e8f0" font-size="13">Order feed table</text>
    <text x="995" y="228" text-anchor="middle" fill="#c3c8db" font-size="12">color-coded risk flags</text>
    <text x="995" y="248" text-anchor="middle" fill="#c3c8db" font-size="12">live threshold slider</text>
    <text x="995" y="268" text-anchor="middle" fill="#c3c8db" font-size="12">metrics panel</text>
    <text x="995" y="292" text-anchor="middle" fill="#7f8bb0" font-size="11">calls API via fetch</text>
    <text x="995" y="308" text-anchor="middle" fill="#7f8bb0" font-size="11">no backend of its own</text>
  </g>

  <!-- Arrows -->
  <g stroke="#6d7db8" stroke-width="3" marker-end="url(#arrow)">
    <line x1="270" y1="230" x2="316" y2="230"/>
    <line x1="550" y1="230" x2="596" y2="230"/>
    <line x1="830" y1="230" x2="876" y2="230"/>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#6d7db8"/>
    </marker>
  </defs>

  <text x="600" y="400" text-anchor="middle" fill="#9aa1b5" font-size="13">Human-in-the-loop: the system flags and recommends (manual verification, delayed capture, address confirmation) — it never auto-cancels an order.</text>
  <text x="600" y="440" text-anchor="middle" fill="#5b6488" font-size="12">Deployed backend: Render/Railway public HTTPS URL · Deployed frontend: Lovable</text>
</svg>
